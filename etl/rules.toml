# ============================================================================
# 北京二手房 ETL 规则配置
# ----------------------------------------------------------------------------
# 手册建议 rules.yaml；本项目改用 TOML，理由：Python 3.11+ 标准库 tomllib 可直接
# 解析，无需安装 PyYAML，与本项目"零运行时依赖"的整体设计保持一致。
# 配置项与手册 R1–R12 规则一一对应，未硬编码任何魔法数。
# ============================================================================

[meta]
rules_version = "1.0.0"
dataset = "北京二手房挂牌数据（2024-08 快照）"

[read]
sheet_index = 0          # 单工作表 Sheet1
all_as_text = true       # 全部按文本读入，防止 Excel 自动转换数值

[columns]
district        = "所在区"
street          = "所在街道或镇"
community       = "小区名"
layout          = "户型"
area            = "面积（平方米）"
orientation     = "朝向"
decoration      = "装修"
floor           = "楼层"
house_age       = "房龄"
structure       = "结构"
total_price     = "总价（万元）"
unit_price      = "单价（元/平方米）"
tag             = "房源标签"
room            = "室"
hall            = "厅"
area_bucket_src = "面积区间"
total_bucket_src = "总价区间"

# ---------------------------------------------------------------------------
# R2 / R3：丢弃的 one-hot 列（共 36 列）
#   17 区 + 4 装修 + 5 结构 + 2 地铁 + 8 朝向
#   其中 R2 单独点名"其他"（装修冗余基线列，D2）
# ---------------------------------------------------------------------------
[onehot]
redundant_baseline_column = "其他"
drop_columns = [
  # 17 个区
  "东城", "丰台", "亦庄开发区", "大兴", "密云", "平谷", "延庆", "怀柔",
  "房山", "昌平", "朝阳", "海淀", "石景山", "西城", "通州", "门头沟", "顺义",
  # 4 个装修（含冗余基线列"其他"）
  "其他", "毛坯", "简装", "精装",
  # 5 个结构
  "塔楼", "平房", "板塔结合", "板楼", "独栋别墅",
  # 2 个地铁
  "不近地铁", "近地铁",
  # 8 个朝向
  "东", "南", "西", "北", "东北", "东南", "西南", "西北",
]

# ---------------------------------------------------------------------------
# R4：朝向多值拆分
#   "南 北" → ["南","北"]；空值缺失；标准方向固定排序，保证输出确定
# ---------------------------------------------------------------------------
[orientation]
standard = ["东南", "东北", "西南", "西北", "东", "南", "西", "北"]
split_pattern = "[\\s\u3000/,、]+"

# ---------------------------------------------------------------------------
# R5：楼层解析（实测 5 种形态 + 兜底）
# ---------------------------------------------------------------------------
[floor]
# 顺序敏感：先匹配更具体的模式
#   level_group = 0 表示该形态的层级取 fixed_level[kind] 的固定值
#   total_group 指向"总层数"所在的捕获组
patterns = [
  { kind = "labeled",   regex = '^(低|中|高)楼层\(共(\d+)层\)$', level_group = 1, total_group = 2 },
  { kind = "topbottom", regex = '^(顶层|底层)\(共(\d+)层\)$',    level_group = 1, total_group = 2 },
  { kind = "stacked",   regex = '^(上叠|下叠)\(共(\d+)层\)$',    level_group = 1, total_group = 2 },
  { kind = "basement",  regex = '^地下室\(共(\d+)层\)$',         level_group = 0, total_group = 1 },
  { kind = "pure",      regex = '^(\d+)层$',                     level_group = 0, total_group = 1 },
]
fallback_level = "未知"

[floor.fixed_level]
basement = "地下"
pure     = "未知"

# ---------------------------------------------------------------------------
# R6：户型解析
# ---------------------------------------------------------------------------
[layout]
regex = "^(\\d+)室(\\d+)厅$"
# 已知非常规组合：标记 abnormal_layout=1，保留不清洗
abnormal_layouts = ["1室2厅"]
# 仅用于报告的信息性提示（不标记为异常）
info_zero_hall = true

# ---------------------------------------------------------------------------
# R7：数值校验
# ---------------------------------------------------------------------------
[validation]
area_min = 0.01
area_max = 1000.0
total_price_min = 0.01
house_age_min = 0
house_age_max = 100
room_min = 1
room_max = 20
hall_min = 0
hall_max = 10
# 单价 = 总价(万) * 10000 / 面积，允许的绝对偏差（元/㎡）
unit_price_tolerance = 1.0

# ---------------------------------------------------------------------------
# R8：极值标记（全局分位截尾，只标记不删除）
# ---------------------------------------------------------------------------
[outlier]
quantile_low = 0.005
quantile_high = 0.995
mark_only = true

# ---------------------------------------------------------------------------
# R9：区间复算（用于校验原始分桶口径，区间列本身不入库）
#   convention: "left_closed" = [low, high) ；"left_open" = (low, high]
# ---------------------------------------------------------------------------
[buckets]
area_boundaries = [60, 90, 120, 150, 180, 210]
area_labels = ["60平方米以下", "60～90平方米", "90～120平方米", "120～150平方米",
               "150～180平方米", "180～210平方米", "210平方米以上"]
total_boundaries = [200, 400, 600, 800, 1000, 2000]
total_labels = ["200万元以下", "200万～400万元", "400万～600万元", "600万～800万元",
                "800万～1000万元", "1000万～2000万元", "2000万元以上"]

# ---------------------------------------------------------------------------
# R11：伪街道识别（"朝阳其他""通州其他" 等聚合桶，非真实街道）
# ---------------------------------------------------------------------------
[street]
pseudo_suffix = "其他"

# ---------------------------------------------------------------------------
# R12：房源标签与"近地铁" one-hot 合并
# ---------------------------------------------------------------------------
[tag]
near_subway_label = "近地铁"

# ---------------------------------------------------------------------------
# 统计口径约定
# ---------------------------------------------------------------------------
[median]
method = "linear_interpolation"
note = """
中位数采用 pandas 默认的线性插值法（偶数样本取中间两值平均）。
手册数据事实卡给出的 57992 元/㎡ 与 81.33 ㎡ 实为"上中位数"（第 n/2+1 个样本），
两者差异仅来自偶数样本的取中方式，不是数据错误。本项目统一使用插值法，
并在质量报告中同时披露上中位数作为对照，避免口径争议。
"""

# ---------------------------------------------------------------------------
# 期望值（对账基线）：实测后回填，用于断言，防止结果漂移
# ---------------------------------------------------------------------------
[expect]
raw_rows = 2890
raw_cols = 53
loaded_rows = 2890
rejected_rows = 0
districts = 17
streets = 264
street_name_only = 237
communities = 1865
community_name_only = 1864
orientation_rows = 4806
# R1：小区名 2890（D1）+ 结构"独栋别墅 "1 条 + 楼层"4层 "1 条 = 2892 个单元格
r1_changed_cells = 2892
r1_community_cells = 2890
unit_price_error_rows = 0
# 中位数（线性插值法）；上中位数对照值见 [median]
median_unit_price = 57985.5
median_unit_price_upper = 57992.0
median_total_price = 470.0
median_area = 81.3
median_area_upper = 81.33
pseudo_street_names = 12
pseudo_street_combos = 16
pseudo_street_prefix_mismatch = 4
pseudo_street_rows = 107
floor_labeled = 1898
floor_topbottom = 610
floor_pure = 364
floor_basement = 17
floor_stacked = 1
floor_unparsed = 0
abnormal_layout_rows = 12
outlier_flagged_rows = 72
bucket_match_rate = 1.0
