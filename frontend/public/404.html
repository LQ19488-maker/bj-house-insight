<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面已迁移 · LTQ 的北京二手房行情洞察系统</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f9fc;
      color: #1f2937;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .box {
      background: #fff;
      border: 1px solid #e3e8ef;
      border-radius: 10px;
      padding: 32px 36px;
      max-width: 460px;
      text-align: center;
      line-height: 1.7;
    }
    h1 { font-size: 18px; margin: 0 0 8px; color: #1a4d8f; }
    p { font-size: 13px; color: #6b7280; margin: 6px 0; }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 8px 18px;
      background: #1a4d8f;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>这个地址已不存在</h1>
    <p>站点已升级为单页应用，旧的原型页面链接（如 <code>p3-detail.html</code>）已失效。</p>
    <p>正在为你跳转到首页，也可以点下面的按钮。</p>
    <a id="home" href="./">返回首页</a>
  </div>
  <script>
    // GitHub Pages 对未知路径返回本文件；这里把访问者送回应用入口。
    // 用相对路径 "./" 而不是绝对路径，换仓库名或域名时无需改代码。
    (function () {
      var base = location.pathname.replace(/[^/]*$/, '');   // 去掉最后一段
      var target = base || '/';
      var link = document.getElementById('home');
      link.setAttribute('href', target);
      setTimeout(function () { location.replace(target); }, 1200);
    })();
  </script>
</body>
</html>
